<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error-bg: #fef2f2;
            --error-text: #dc2626;
            --success-bg: #f0fdf4;
            --success-text: #16a34a;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            background: #f8fafc;
            border-radius: 12px;
            padding: 6px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--text);
            background: #fbfcfd;
            transition: all 0.2s ease;
        }

        input:hover {
            border-color: #cbd5e1;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            margin-top: 6px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: none;
        }
        .alert.success { background: var(--success-bg); color: var(--success-text); border: 1px solid #bbf7d0; display: block; }
        .alert.error { background: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" onclick="switchTab('register')">Sign Up</button>
        </div>

        <!-- LOGIN SECTION -->
        <div id="loginSection" class="form-section active">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in.</p>
            <div id="loginAlert" class="alert"></div>
            <form id="loginForm" novalidate>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="logName" placeholder="Enter your username" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="logPassword" placeholder="••••••••" required>
                </div>
                
                <!-- YENİ EKLENEN: Remember Me ve Forgot Password Yan Yana -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: -5px; margin-bottom: 20px;">
                    <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-light); font-weight: 500; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" id="rememberMe" style="width: 16px; height: 16px; accent-color: #6366f1; border-radius: 4px; padding: 0; margin: 0; cursor: pointer;">
                        Remember me
                    </label>
                    <a href="/forgot-password.html" style="font-size: 13px; color: var(--primary); text-decoration: none; font-weight: 500; transition: 0.2s;">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>
        </div>


        <!-- REGISTER SECTION -->
        <div id="registerSection" class="form-section">
            <h2>Create Account</h2>
            <p class="subtitle">Join us today! Fill in your information.</p>
            <div id="regAlert" class="alert"></div>
            <form id="registerForm" novalidate>
                <div id="registerAlert" style="display: none; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px;"></div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="regName" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <label>Gmail Address</label>
                    <input type="email" id="regEmail" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        // OTOMATİK YÖNLENDİRME KODU (Doğru yere, <script> etiketinin tam içine alındı)
        const existingToken = localStorage.getItem('token');
        if (existingToken) {
            window.location.href = '/dashboard.html';
        }

        function switchTab(tab) {
            const loginSec = document.getElementById('loginSection');
            const regSec = document.getElementById('registerSection');
            const btns = document.querySelectorAll('.tab-btn');

            btns.forEach(b => b.classList.remove('active'));

            if (tab === 'login') {
                loginSec.classList.add('active');
                regSec.classList.remove('active');
                btns[0].classList.add('active');
            } else {
                regSec.classList.add('active');
                loginSec.classList.remove('active');
                btns[1].classList.add('active');
            }
        }

  // Register Handler
  console.log("JavaScript dosyasi calisiyor!");
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;

    try {
        const res = await fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
            // Tarayıcının kendi garanti başarı bildirimi
            alert("Registration successful! You can now log in.");
            
            // Formu temizle ve sayfayı yenile (Giriş ekranına dön)
            document.getElementById('registerForm').reset();
            window.location.reload();
        } else {
            // Sunucudan gelen hata mesajı (Örn: Bu mail zaten kayıtlı)
            alert(data.message || "An error occurred during registration.");
        }
    } catch (err) {
        alert("An error occurred connecting to the server.");
    }
});

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('logName').value;
            const password = document.getElementById('logPassword').value;
            
            const rememberMe = document.getElementById('rememberMe').checked; 
            
            const alertBox = document.getElementById('loginAlert');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, password, rememberMe })
                });
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', name);
                    localStorage.setItem('role', data.role);
                    window.location.href = '/dashboard.html';
                } else {
                    alertBox.className = 'alert error';
                    alertBox.textContent = data.message;
                }
            } catch (err) {
                alertBox.className = 'alert error';
                alertBox.textContent = "An error occurred.";
            }
        });
    </script>
</body>
</html>
