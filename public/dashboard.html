<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --error-text: #dc2626;
            --success-text: #16a34a;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar Tasarımı */
        .navbar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            color: white;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Ana İçerik */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            margin-bottom: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-title {
            margin-top: 0;
            font-size: 24px;
            color: var(--text);
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .role-admin { background: #fee2e2; color: #991b1b; }
        .role-user { background: var(--primary-light); color: var(--primary-hover); }

        /* Tablo Tasarımı */
        .admin-section { display: none; }
        
        .table-wrapper {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f8fafc;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text);
        }

        tr:last-child td { border-bottom: none; }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-delete { background: #fee2e2; color: #dc2626; }
        .btn-delete:hover { background: #fca5a5; }
        
        .alert {
            padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
            margin-bottom: 20px; display: none;
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav class="navbar">
        <div class="navbar-brand">Portal.</div>
        <button class="logout-btn" onclick="logout()">Sign Out</button>
    </nav>

    <div class="container">
        <!-- Karşılama Kartı -->
        <div class="card">
            <h1 class="welcome-title">Welcome back, <span id="userNameDisplay" style="color: var(--primary);">User</span>! 👋</h1>
            <p style="color: var(--text-light); font-size: 14px;">We're glad to see you again. Your current access level is: 
                <span id="userRoleBadge" class="role-badge">USER</span>
            </p>
        </div>

        <!-- Admin Paneli Kartı (Sadece Adminlere Görünecek) -->
        <div id="adminPanel" class="card admin-section">
            <h2 style="margin-top: 0; font-size: 20px;">System Users</h2>
            <p style="color: var(--text-light); font-size: 14px; margin-bottom: 20px;">Manage registered users and their access roles.</p>
            
            <div id="adminAlert" class="alert"></div>

            <div class="table-wrapper">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Kullanıcılar buraya JavaScript ile eklenecek -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 1. GÜVENLİK KONTROLÜ: Token yoksa direkt Login sayfasına at
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/index.html';
        }

        // 2. KULLANICI BİLGİLERİNİ EKRANA BAS
        const username = localStorage.getItem('username');
        const role = localStorage.getItem('role');

        document.getElementById('userNameDisplay').textContent = username || 'User';
        
        const badge = document.getElementById('userRoleBadge');
        badge.textContent = (role || 'user').toUpperCase();
        if (role === 'admin') {
            badge.className = 'role-badge role-admin';
            // Adminse paneli görünür yap ve kullanıcıları çek
            document.getElementById('adminPanel').style.display = 'block';
            fetchUsers();
        } else {
            badge.className = 'role-badge role-user';
        }

        // 3. ÇIKIŞ YAP FONKSİYONU
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            window.location.href = '/index.html';
        }

        // 4. ADMİN İŞLEMLERİ (Kullanıcıları Getir)
        async function fetchUsers() {
            try {
                // Not: Backend'de bu endpointin adı ve yetkilendirmesi ayarlanmış olmalı
                const res = await fetch('/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const users = await res.json();
                    renderTable(users);
                } else {
                    console.error("Kullanıcılar çekilemedi.");
                }
            } catch (err) {
                console.error("Bağlantı hatası:", err);
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = ''; // Tabloyu temizle

            users.forEach(u => {
                const tr = document.createElement('tr');
                
                // Rol rengi belirleme
                const roleColor = u.role === 'admin' ? 'color: #991b1b; font-weight: 600;' : 'color: var(--primary); font-weight: 600;';

                tr.innerHTML = `
                    <td>${u.name}</td>
                    <td>${u.email}</td>
                    <td style="${roleColor}">${u.role.toUpperCase()}</td>
                    <td>
                        <button class="action-btn btn-delete" onclick="deleteUser('${u._id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Kullanıcı Silme Fonksiyonu
        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user?')) return;

            const alertBox = document.getElementById('adminAlert');
            try {
                const res = await fetch(`/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    alertBox.style.display = 'block';
                    alertBox.className = 'alert success';
                    alertBox.textContent = 'User deleted successfully.';
                    fetchUsers(); // Tabloyu yenile
                    setTimeout(() => alertBox.style.display = 'none', 3000);
                } else {
                    const data = await res.json();
                    alertBox.style.display = 'block';
                    alertBox.className = 'alert error';
                    alertBox.textContent = data.message || 'Error deleting user.';
                }
            } catch (err) {
                alertBox.style.display = 'block';
                alertBox.className = 'alert error';
                alertBox.textContent = 'Connection error.';
            }
        }
    </script>
</body>
</html>
